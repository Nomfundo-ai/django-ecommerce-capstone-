{% extends "ecommerce/base.html" %}
{% block title %}My orders{% endblock %}
{% block content %}
  <h1>My orders</h1>
  <table>
    <tr><th>Order</th><th>Date</th><th>Total</th><th></th></tr>
    {% for order in orders %}
      <tr>
        <td>#{{ order.id }}</td>
        <td>{{ order.created_at }}</td>
        <td>R{{ order.total }}</td>
        <td><a href="{% url 'ecommerce:order_detail' order.id %}">View</a></td>
      </tr>
    {% empty %}
      <tr><td colspan="4" class="muted">No orders yet.</td></tr>
    {% endfor %}
  </table>
{% endblock %}
